<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Грибной лес</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="config.js"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    body { background: #14211a; color: #e8f5e0; font-family: sans-serif; overflow: hidden;
           user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    button { font-family: inherit; }
    #app { display: flex; flex-direction: column; height: 100dvh; }

    /* ---------- верхняя панель ---------- */
    #hud { background: #0e1712; padding: 8px 14px 10px; }
    .row { display: flex; justify-content: space-between; align-items: baseline; }
    #spores { font-size: 26px; font-weight: bold; }
    #dust { font-size: 20px; }
    #income, #time, #status { font-size: 13px; opacity: .7; }
    #status:empty { display: none; }
    #lvlrow { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; }
    #lvl { font-weight: bold; color: #ffe27a; min-width: 44px; }
    #xpbar { flex: 1; height: 8px; border-radius: 4px; background: #24402c; overflow: hidden; }
    #xpfill { height: 100%; width: 0; background: linear-gradient(90deg, #ffb020, #ffe27a); transition: width .2s; }
    #xptext { opacity: .7; min-width: 70px; text-align: right; }

    /* ---------- поляна ---------- */
    #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
             background: url(assets/ground.webp) center / cover no-repeat, #0f1d14;
             box-shadow: inset 0 14px 14px -10px rgba(0,0,0,.65), inset 0 -14px 14px -10px rgba(0,0,0,.65); }
    #scene { position: relative; z-index: 0; isolation: isolate; touch-action: manipulation; }   /* z-index слотов не вылезает за поляну */
    #scene.nomeadow { background: radial-gradient(ellipse at 50% 48%, #3f7a45 0%, #2a5230 55%, rgba(20,33,26,0) 72%); }
    #meadow { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

    /* слот: x, y сервера = точка, где стоит ножка гриба (86% высоты квадрата слота) */
    .slot { position: absolute; transform: translate(-50%, -86%); transform-origin: 50% 86%; }
    .slot .mound { position: absolute; left: 50%; top: 86%; width: 118%; transform: translate(-50%, -30%);
                   pointer-events: none; }
    .slot .ico { position: absolute; inset: 0; }
    .slot .lock { position: absolute; left: 50%; top: 86%; width: 46%; transform: translate(-50%, -68%);
                  pointer-events: none; text-align: center; opacity: .75; }
    .slot .plus { position: absolute; left: 50%; top: 86%; transform: translate(-50%, -60%); line-height: 1;
                  font-weight: bold; color: #fff3c0; text-shadow: 0 0 6px #000, 0 0 2px #000;
                  opacity: .85; pointer-events: none; }
    .slot.locked .mound { filter: grayscale(.6) brightness(.55); }
    .slot.locked.next .mound { filter: grayscale(.15) brightness(.85); }
    .slot.locked.next .lock { opacity: 1; }
    .slot.empty.target { animation: pulse 1s infinite; }
    @keyframes pulse { 50% { transform: translate(-50%, -86%) scale(1.12); } }
    .slot.locked.wild .lock.tint { filter: sepia(1) saturate(5) hue-rotate(-18deg) brightness(.95); }   /* рыжий замок, если нет своей картинки */
    .slot.locked.wild .mound { filter: grayscale(.3) brightness(.6) sepia(.5) hue-rotate(-20deg); }
    .slot.wild.empty { pointer-events: none; }
    .slot.boost .ico { filter: drop-shadow(0 0 6px #9be7ff); }
    .slot.bump { animation: bump .15s; }
    @keyframes bump { 50% { transform: translate(-50%, -86%) scale(.9); } }
    .cost { position: absolute; top: 134%; left: 50%; transform: translateX(-50%); font-size: 11px;
            white-space: nowrap; color: #ffb4b4; background: rgba(0,0,0,.55); border-radius: 6px; padding: 1px 6px; }
    .cost.ok { color: #9dff9d; }

    .pop { position: absolute; font-weight: bold; color: #fff3a0; pointer-events: none;
           animation: pop .7s ease-out forwards; }
    @keyframes pop { to { transform: translateY(-50px); opacity: 0; } }

    /* ---------- иконка гриба (картинка или эмодзи) ---------- */
    .ico { display: flex; align-items: center; justify-content: center; font-size: 28px; line-height: 1; }
    .ico img { width: 100%; height: 100%; min-width: 0; min-height: 0; object-fit: contain; pointer-events: none; }
    .cur { height: 1.05em; width: auto; vertical-align: -.17em; image-rendering: auto; pointer-events: none; }
    #spores .cur { height: .95em; vertical-align: -.12em; }
    .ico.anim { background-repeat: no-repeat; background-position: 0 0; }
    .slot .ico.anim { inset: -26% -26% -6% -26%; }   /* в кадрах анимации по краям свечение, поэтому кадр крупнее ячейки */
    .glossy { filter: drop-shadow(0 0 5px #ffe27a) brightness(1.15); }

    /* ---------- нижняя панель: крупные, приподняты от края, выпуклые ---------- */
    #nav { display: flex; gap: 8px; padding: 10px 10px calc(16px + env(safe-area-inset-bottom));
           background: linear-gradient(#101b14, #0a110d); border-top: 1px solid #2c4636;
           box-shadow: 0 -4px 14px rgba(0,0,0,.45); }
    #nav button { flex: 1; min-width: 0; min-height: 64px; padding: 6px 2px; position: relative;
                  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
                  border: 1px solid #4a7a58; border-radius: 16px; color: #f2fbe8;
                  background: linear-gradient(#3a6b46, #25492f);
                  box-shadow: 0 4px 0 #112519, 0 6px 10px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.18);
                  font-size: 11.5px; font-weight: 700; transition: transform .08s, box-shadow .08s; }
    #nav button .ic { font-size: 26px; line-height: 1; }
    #nav button .lb { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #nav button:active { transform: translateY(3px); box-shadow: 0 1px 0 #112519, inset 0 1px 0 rgba(255,255,255,.1); }
    #nav .dot { position: absolute; top: 6px; right: 8px; width: 10px; height: 10px;
                border-radius: 50%; background: #ff5d5d; box-shadow: 0 0 0 2px #25492f; }
    #nav .dot[hidden] { display: none; }

    /* ---------- шторка инвентаря ---------- */
    #sheet { position: fixed; left: 50%; bottom: 0; width: min(100vw, 520px);
             display: flex; flex-direction: column; max-height: 66dvh; overflow: hidden;
             transform: translate(-50%, 105%); visibility: hidden;
             transition: transform .25s ease, visibility 0s .25s;
             background: #1d3325; border-radius: 18px 18px 0 0;
             padding: 8px 10px calc(14px + env(safe-area-inset-bottom));
             box-shadow: 0 -6px 24px rgba(0,0,0,.5); z-index: 10; box-sizing: border-box; }
    #sheet.open { transform: translate(-50%, 0); visibility: visible; transition: transform .25s ease, visibility 0s; }
    #sheet.dragging { pointer-events: none; }
    #sheetHead { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 4px 6px; flex: none; }
    #sheetHead b { font-size: 16px; }
    #invCount { opacity: .7; font-size: 13px; margin-left: 8px; }
    #sheetBtns { display: flex; gap: 8px; align-items: center; }
    #sellAll { border: 0; border-radius: 14px; padding: 7px 12px; background: #8a6a1f; color: #fff;
               font-size: 13px; font-weight: bold; white-space: nowrap; }
    #sellAll.on { background: #b8452f; }
    #sheetClose { border: 0; background: #2a4533; color: #e8f5e0; width: 32px; height: 32px;
                  border-radius: 50%; font-size: 16px; }
    #sheetHint { font-size: 13px; color: #ffe27a; min-height: 0; padding: 0 4px; flex: none; }
    #sheetHint:empty { display: none; }
    #sellPanel { flex: none; padding: 2px 0 8px; }
    #sellPanel[hidden] { display: none; }
    #sellChips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; }
    #sellChips::-webkit-scrollbar { display: none; }
    #sellGo { width: 100%; border: 0; border-radius: 12px; padding: 11px; background: #b8452f; color: #fff;
              font-size: 15px; font-weight: bold; }
    #sellGo:disabled { background: #3a3a3a; color: #aaa; }
    #sheet.selling #tabs, #sheet.selling #sortRow { display: none; }
    #sortRow { display: flex; align-items: center; gap: 6px; padding: 0 0 8px; flex: none; font-size: 12px; opacity: .95; }
    #sortRow span { opacity: .65; }
    #sortRow button { border: 0; border-radius: 8px; padding: 5px 10px; background: #2a4533; color: #e8f5e0; font-size: 12.5px; }
    #sortRow button.on { background: #3d8a4f; font-weight: bold; }
    .cell.drop-target { outline: 2px solid #ffe27a; background: #24402c; }
    #tabs { display: flex; gap: 6px; padding: 4px 0 8px; overflow-x: auto; flex: none; }
    #tabs button { border: 0; border-radius: 8px; padding: 6px 12px; background: #2a4533;
                   color: #e8f5e0; font-size: 13px; white-space: nowrap; }
    #tabs button.on { background: #3d8a4f; }
    #tabs button.buy { background: #3a3a2a; color: #ffe27a; }
    /* minmax(0,1fr) и иконка поверх ячейки: картинка не может растянуть сетку */
    #grid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; padding: 3px;
            flex: 0 1 auto; min-height: 0; overflow-y: auto; }
    .cell { aspect-ratio: 1; min-width: 0; min-height: 0; border-radius: 8px; background: #14211a;
            border: 2px solid #2c4636; position: relative; box-sizing: border-box; font-size: 20px; touch-action: none; }
    .cell .ico { position: absolute; inset: 2px; width: auto; height: auto; font-size: inherit; }
    .cell .ico img { position: absolute; inset: 0; }
    .cell .lv { position: absolute; right: -2px; bottom: -2px; background: #8a2f2f; color: #fff;
                font-size: 10px; border-radius: 6px; padding: 0 4px; }
    .cell.sel { outline: 2px solid #ffe27a; background: #2f4a37; }
    #sheet.selling .cell[data-item] { opacity: .35; }
    #sheet.selling .cell.picked { opacity: 1; outline: 2px solid #ff7a5c; }

    /* ---------- проверка «ты не робот?» ---------- */
    #antiBar { font-size: 13px; color: #ffb4b4; padding-top: 4px; }
    #antiBar:empty { display: none; }
    #antiModal { position: fixed; inset: 0; z-index: 45; display: grid; place-items: center; padding: 20px;
                 background: rgba(0,0,0,.78); }
    #antiModal[hidden] { display: none; }
    #antiCard { width: min(88vw, 340px); box-sizing: border-box; padding: 20px; text-align: center;
                border: 1px solid #3d8a4f; border-radius: 18px; background: #1d3325; }
    #antiOpts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
    #antiOpts button { border: 0; border-radius: 14px; padding: 12px 0; font-size: 34px; background: #2a4533; }
    #antiOpts button:active { background: #3d8a4f; }

    /* ---------- пассивный доход: еле заметная дрожь гриба и бледное "+N" над ним ---------- */
    .slot .ico { transform-origin: 50% 86%; }
    .ptick { position: absolute; left: 50%; top: -2%; transform: translateX(-50%); white-space: nowrap;
             font-weight: bold; color: #d8f2b4; text-shadow: 0 0 3px #000, 0 0 2px #000;
             opacity: 0; pointer-events: none; }

    /* ---------- магазин (аукцион) ---------- */
    input { user-select: text; -webkit-user-select: text; }
    #shop { position: fixed; left: 50%; bottom: 0; width: min(100vw, 520px); height: 88dvh;
            display: flex; flex-direction: column; box-sizing: border-box;
            transform: translate(-50%, 105%); visibility: hidden;
            transition: transform .25s ease, visibility 0s .25s;
            background: #1d3325; border-radius: 18px 18px 0 0; box-shadow: 0 -6px 24px rgba(0,0,0,.5); z-index: 10; }
    #shop.open { transform: translate(-50%, 0); visibility: visible; transition: transform .25s ease, visibility 0s; }
    .phead { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 6px; }
    .phead b { font-size: 17px; }
    .phead .sub { display: block; font-size: 12px; opacity: .7; margin-top: 2px; }
    .xbtn { border: 0; background: #2a4533; color: #e8f5e0; width: 32px; height: 32px; border-radius: 50%; font-size: 16px; }
    #shopBody { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 12px 8px; }

    #deal { position: relative; margin: 8px 0 6px; padding: 10px 12px 12px; border-radius: 14px;
            background: linear-gradient(135deg, #4d3c14, #2d2b15 60%, #1f3a2a);
            border: 1px solid #c9a23a; box-shadow: 0 0 14px rgba(255,200,60,.18); }
    #deal:empty { display: none; }
    #deal .dtop { display: flex; justify-content: space-between; font-size: 12px; font-weight: bold;
                  color: #ffd76a; letter-spacing: .04em; text-transform: uppercase; padding-right: 54px; }
    #deal .dmain { display: flex; gap: 12px; align-items: center; margin-top: 8px; }
    #deal .ico { width: 64px; height: 64px; flex: none; font-size: 44px; }
    #deal .dname { font-size: 16px; font-weight: bold; }
    #deal .badge { position: absolute; top: -9px; right: -6px; background: #e0453a; color: #fff; font-weight: bold;
                   font-size: 16px; padding: 3px 10px; border-radius: 12px; transform: rotate(4deg);
                   box-shadow: 0 2px 6px rgba(0,0,0,.5); }
    #deal .dbuy { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; }
    #deal s { opacity: .55; font-size: 13px; margin-right: 4px; }
    #deal .newp { font-size: 19px; font-weight: bold; color: #fff3c0; }

    .buy { border: 0; border-radius: 10px; padding: 9px 12px; background: #3d8a4f; color: #fff; font-size: 14px;
           font-weight: bold; white-space: nowrap; min-width: 92px; }
    .buy.poor { background: #4a3535; color: #ff9d9d; }
    .buy.lock, .buy.sold { background: #3a3a3a; color: #aaa; }

    #shopTools { position: sticky; top: 0; z-index: 2; background: #1d3325; padding: 6px 0 2px; }
    #search { width: 100%; box-sizing: border-box; border: 0; border-radius: 10px; padding: 10px 12px;
              background: #14211a; color: #e8f5e0; font-size: 16px; outline: 1px solid #2c4636; }
    #chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 6px; scrollbar-width: none; }
    #chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; border: 1px solid var(--c, #3d5a47); background: #14211a; color: #e8f5e0;
            border-radius: 14px; padding: 5px 10px; font-size: 12.5px; white-space: nowrap; }
    .chip i { font-style: normal; opacity: .7; margin-left: 5px; }
    .chip.on { background: var(--c, #3d8a4f); color: #10180f; font-weight: bold; }
    .chip.zero:not(.on) { opacity: .45; }

    .lot { display: flex; gap: 10px; align-items: center; padding: 8px 10px; margin-bottom: 6px;
           border-radius: 12px; background: #17291e; border-left: 4px solid var(--c, #555); }
    .lot.sold { opacity: .45; }
    .lot .ico { width: 48px; height: 48px; flex: none; font-size: 32px; }
    .lot .info { flex: 1; min-width: 0; }
    .lot .nm { font-weight: bold; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lot .rr { font-size: 12px; }
    .st { font-size: 11.5px; opacity: .7; }
    .empty { text-align: center; padding: 26px 12px; opacity: .75; font-size: 14px; line-height: 1.5; }

    #shopFoot { padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); background: #16281d;
                border-top: 1px solid #2c4636; border-radius: 0; }
    #btnRefresh { width: 100%; padding: 12px; border: 0; border-radius: 12px; background: #3d8a4f; color: #fff;
                  font-size: 15px; font-weight: bold; }
    #btnRefresh.poor { background: #4a3535; color: #ff9d9d; }
    #btnRefresh:disabled { background: #3a3a3a; color: #aaa; }
    #refreshNote { font-size: 12px; opacity: .7; text-align: center; margin-top: 6px; }

    /* ---------- карточки поверх всего ---------- */
    #info { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 20;
            display: flex; align-items: center; justify-content: center; }
    #info[hidden] { display: none; }
    #card { background: #1d3325; border-radius: 16px; padding: 18px 20px; width: min(86vw, 340px);
            line-height: 1.5; max-height: 80vh; overflow: auto; }
    #card button { border: 0; border-radius: 10px; padding: 10px 14px; background: #3d8a4f;
                   color: #fff; font-size: 15px; }
    #card button.ghost { background: #2a4533; }
    #card button.dim { background: #4a4a4a; color: #aaa; }
    #card button.sell { background: #8a6a1f; }
    .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .head { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
    .head .ico { width: 64px; height: 64px; font-size: 48px; flex: none; }
    .bad { color: #ff9d9d; }
    .big { font-size: 20px; font-weight: bold; }
    .muted { opacity: .75; }
    #toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 30;
             background: rgba(20,40,28,.95); border: 1px solid #3d8a4f; padding: 8px 14px;
             border-radius: 12px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .25s; }
    #toast.show { opacity: 1; }
    #afkModal { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center;
                padding: 20px; background: rgba(0,0,0,.72); }
    #afkModal[hidden] { display: none; }
    #afkCard { width: min(86vw, 360px); box-sizing: border-box; padding: 20px;
               border: 1px solid #3d8a4f; border-radius: 18px; background: #1d3325; text-align: center; }
    #afkTitle { margin-bottom: 10px; font-size: 16px; opacity: .85; }
    #afkEarned { margin: 14px 0 0; color: #ffe27a; font-size: 25px; font-weight: bold; }
    #afkBar { height: 12px; margin: 0 0 6px; overflow: hidden; border-radius: 8px; background: #14211a; }
    #afkFill { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #3d8a4f, #ffe27a); }
    #afkTime { font-size: 13px; opacity: .8; }
    #afkClose { margin-top: 16px; border: 0; border-radius: 10px; padding: 10px 24px;
                background: #3d8a4f; color: #fff; font-size: 15px; }
    .drag-ghost { position: fixed; z-index: 60; width: 64px; height: 64px; pointer-events: none;
                  opacity: .85; transform: translate(-50%, -50%); filter: drop-shadow(0 4px 8px #000); }
    .afk-particle { position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none;
                    font-size: 18px; will-change: transform, opacity, filter;
                    filter: drop-shadow(0 0 5px rgba(255,226,122,.9)); }
    .slot.drop-target { outline: 3px solid #ffe27a; outline-offset: 2px; border-radius: 50%; }
  </style>
</head>
<body>
  <div id="app">
    <div id="hud">
      <div class="row"><div id="spores">🌱 0</div><div id="dust">✨ 0</div></div>
      <div class="row"><div id="income"></div><div id="time">⏱ 00:00</div></div>
      <div id="lvlrow">
        <span id="lvl">Ур. 1</span>
        <div id="xpbar"><div id="xpfill"></div></div>
        <span id="xptext">0/100</span>
      </div>
      <div id="status"></div>
      <div id="antiBar"></div>
    </div>

    <div id="stage"><div id="scene"><img id="meadow" src="assets/meadow.webp" alt="" draggable="false"></div></div>

    <div id="nav">
      <button id="btnInv" title="Инвентарь"><span class="ic">🎒</span><span class="lb">Инвентарь</span></button>
      <button id="btnShop" title="Магазин"><span class="ic">🛒</span><span class="lb">Магазин</span><span class="dot" id="shopDot" hidden></span></button>
      <button id="btnMut" title="Мутации"><span class="ic">🧬</span><span class="lb">Мутации</span></button>
      <button id="btnPack" title="Паки"><span class="ic">🎁</span><span class="lb">Паки</span></button>
      <button id="btnUpgrades" title="Улучшения"><span class="ic">⬆️</span><span class="lb">Улучш.</span></button>
    </div>
  </div>

  <div id="sheet">
    <div id="sheetHead">
      <div><b>🎒 Инвентарь</b><span id="invCount"></span></div>
      <div id="sheetBtns"><button id="sellAll">💰 Продать все</button><button id="sheetClose">✕</button></div>
    </div>
    <div id="sheetHint"></div>
    <div id="sellPanel" hidden>
      <div id="sellChips"></div>
      <button id="sellGo" disabled>Выбери редкости</button>
    </div>
    <div id="tabs"></div>
    <div id="sortRow"><span>Сортировка:</span><button data-by="rarity"></button><button data-by="price"></button></div>
    <div id="grid"></div>
  </div>

  <div id="shop">
    <div class="phead">
      <div><b>🛒 Аукцион</b><span class="sub">Новые лоты через <span id="lotsTimer">--:--:--</span></span></div>
      <button class="xbtn" id="shopClose">✕</button>
    </div>
    <div id="shopBody">
      <div id="deal"></div>
      <div id="shopTools">
        <input id="search" type="search" placeholder="🔍 Поиск по названию" autocomplete="off" enterkeyhint="search">
        <div id="chips"></div>
      </div>
      <div id="lots"></div>
    </div>
    <div id="shopFoot">
      <button id="btnRefresh">🔄 Обновить лоты</button>
      <div id="refreshNote"></div>
    </div>
  </div>

  <div id="info" hidden><div id="card"></div></div>
  <div id="afkModal" hidden>
    <div id="afkCard">
      <div id="afkBar"><div id="afkFill"></div></div>
      <div id="afkTime"></div>
      <div id="afkTitle">Ты заработал:</div>
      <div id="afkEarned"></div>
      <button id="afkClose">Продолжить</button>
    </div>
  </div>
  <div id="antiModal" hidden>
    <div id="antiCard">
      <div class="big">🤖 Проверка</div>
      <div class="muted" style="margin-top:6px">Клики слишком ровные. Подтверди, что ты человек:</div>
      <div id="antiAsk" class="big" style="margin-top:10px"></div>
      <div id="antiOpts"></div>
    </div>
  </div>
  <div id="toast"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();

    const $ = (id) => document.getElementById(id);
    const scene = $("scene"), stage = $("stage");
    const SCENE_RATIO = 1102 / 682;      // ширина / высота картинки поляны (meadow.webp)
    $("meadow").onerror = () => { $("meadow").remove(); scene.classList.add("nomeadow"); };

    // ---------- состояние ----------
    let state = null;                    // последнее состояние с сервера
    let spores = 0, dust = 0, xp = 0;    // то, что видит игрок (с учётом ещё не отправленных кликов)
    let clickPower = 0, passive = 0;
    let pending = 0;                     // клики, ещё не отправленные на сервер
    let slotEls = [], slotSig = "", invSig = "";
    let costEl = null, nextCost = null;
    let targetSlot = null;               // слот, который игрок хочет заполнить (тапнул по ➕)
    let curTab = 0;
    let holdTimer = null, held = false, infoOpenedAt = 0, scenePointer = null;
    let busy = false, syncing = false;
    let afkShown = false;
    let inventoryGesture = null, dragGhost = null;
    let shopData = null, shopAt = 0, shopOpen = false;
    const sessionStart = Date.now();

    // ---------- мелочи ----------
    const fmt = (n) => Math.floor(n).toLocaleString("ru-RU");
    const fmtTime = (s) => {
      s = Math.max(0, Math.floor(s));
      return [Math.floor(s / 3600), Math.floor(s % 3600 / 60), s % 60]
        .map((v) => String(v).padStart(2, "0")).join(":");
    };
    function alertMsg(t) { try { tg.showAlert(t); } catch (_) { alert(t); } }
    let toastTimer = null;
    function toast(t) {
      $("toast").textContent = t;
      $("toast").classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => $("toast").classList.remove("show"), 1800);
    }
    const saleText = (sp, du) => (fmt(sp) + " 🌱") + (du ? " + " + fmt(du) + " ✨" : "");
    const nextLocked = () => (state ? state.slots.findIndex((s) => !s.unlocked && !s.wild) : -1);
    const pct = (v) => "+" + Math.round(v * 100) + "%";

    // Иконки валют: везде, где в тексте стоит 🌱 или ✨, подставляем твои картинки (assets/icon_spores.png, icon_dust.png).
    // Если файла нет, остаётся эмодзи. Для обычной звёздочки у глянцевых грибов используется 💎.
    const CUR = { "🌱": "assets/icon_spores.png", "✨": "assets/icon_dust.png" };
    const brokenCur = new Set();
    function curify(root) {
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      const nodes = [];
      for (let n = walker.nextNode(); n; n = walker.nextNode()) if (/[🌱✨]/u.test(n.nodeValue)) nodes.push(n);
      nodes.forEach((n) => {
        if (n.parentNode && /^(SCRIPT|STYLE|TEXTAREA|INPUT)$/.test(n.parentNode.nodeName)) return;
        const frag = document.createDocumentFragment();
        n.nodeValue.split(/([🌱✨])/u).forEach((part) => {
          if (!CUR[part] || brokenCur.has(part)) { if (part) frag.appendChild(document.createTextNode(part)); return; }
          const img = new Image();
          img.className = "cur"; img.alt = part; img.src = CUR[part]; img.draggable = false;
          img.onerror = () => { brokenCur.add(part); img.replaceWith(document.createTextNode(part)); };
          frag.appendChild(img);
        });
        n.parentNode.replaceChild(frag, n);
      });
    }
    new MutationObserver((list) => {
      for (const m of list) {
        m.addedNodes.forEach((n) => { if (n.nodeType === 1) curify(n); else if (n.nodeType === 3 && n.parentNode) curify(n.parentNode); });
        if (m.type === "characterData" && m.target.parentNode) curify(m.target.parentNode);
      }
    }).observe(document.body, { childList: true, subtree: true, characterData: true });
    function setText(el, t) { if (el._t !== t) { el._t = t; el.textContent = t; } }

    // Анимированные грибы: полоса кадров (assets/<id>_idle.png стоит, assets/<id>_click.png при клике).
    // Формат: [файл, число кадров, длительность цикла в мс]. Чтобы оживить другой гриб, добавь его сюда.
    const ANIM = {
      golden_fly_agaric: { idle: ["assets/golden_fly_agaric_idle.png", 6, 1100], click: ["assets/golden_fly_agaric_click.png", 8, 480] },
    };
    function playAnim(ico, name) {
      const a = ANIM[ico.dataset.mid]; if (!a || !ico.animate) return;
      const [src, n, ms] = a[name];
      ico.dataset.cur = name;
      ico.style.backgroundImage = `url(${src})`;
      ico.style.backgroundSize = n * 100 + "% 100%";
      if (ico._an) ico._an.cancel();
      ico._an = ico.animate([{ backgroundPosition: "0% 0%" }, { backgroundPosition: "100% 0%" }],
        { duration: ms, iterations: name === "idle" ? Infinity : 1, easing: `steps(${n}, jump-none)` });
      if (name === "click") ico._an.onfinish = () => playAnim(ico, "idle");
    }

    // иконка гриба: твоя текстура, а если файла нет, то эмодзи (и больше этот файл не запрашиваем)
    const missingSprites = new Set();
    function spriteMissing(img, sprite, emoji) { missingSprites.add(sprite); img.parentNode.textContent = emoji; }
    function icon(m, live) {
      const wrap = document.createElement("div");
      if (live && ANIM[m.id] && wrap.animate) {              // гриб на поляне: живая анимация
        wrap.className = "ico anim" + (m.glossy ? " glossy" : "");
        wrap.dataset.mid = m.id;
        playAnim(wrap, "idle");
        return wrap;
      }
      wrap.className = "ico" + (m.glossy ? " glossy" : "");
      if (missingSprites.has(m.sprite)) { wrap.textContent = m.emoji; return wrap; }
      const img = new Image();
      img.src = "assets/" + m.sprite;
      img.draggable = false;
      img.onerror = () => { missingSprites.add(m.sprite); img.remove(); wrap.textContent = m.emoji; };
      wrap.appendChild(img);
      return wrap;
    }
    function iconHtml(m) {
      const cls = "ico" + (m.glossy ? " glossy" : "");
      if (missingSprites.has(m.sprite)) return `<div class="${cls}">${m.emoji}</div>`;
      return `<div class="${cls}"><img src="assets/${m.sprite}" draggable="false"
              onerror="spriteMissing(this,'${m.sprite}','${m.emoji}')"></div>`;
    }

    // ---------- связь с сервером ----------
    async function api(path, body) {
      const opt = { headers: { "X-Init-Data": tg.initData } };
      if (body !== undefined) {
        opt.method = "POST";
        opt.headers["Content-Type"] = "application/json";
        opt.body = JSON.stringify(body);
      }
      const r = await fetch(API + path, opt);
      if (!r.ok) {
        const err = await r.json().catch(() => ({}));
        const e = new Error(typeof err.detail === "string" ? err.detail : "ошибка " + r.status);
        e.status = r.status;
        throw e;
      }
      return r.json();
    }

    // Клики уходят на сервер пачками вместе со "следами" нажатий (время, место, длительность):
    // по ним сервер отличает человека от автокликера. Пачка хранится, пока сервер её не подтвердит.
    const CLIENT_V = 2, MAX_BATCH = 200, MAX_TAP_LOG = 100;
    let outbox = null, tapLog = [], tapBase = null;
    const unsent = () => pending + (outbox ? outbox.clicks : 0);
    function newBid() {
      const a = new Uint8Array(8);
      (window.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : a.forEach((_, i) => a[i] = Math.random() * 256);
      return Array.from(a, (b) => b.toString(16).padStart(2, "0")).join("");
    }
    function takeBatch() {
      const clicks = Math.min(pending, MAX_BATCH);
      pending -= clicks;
      const taps = tapLog;
      tapLog = []; tapBase = null;
      return { bid: newBid(), clicks, taps };
    }
    async function sync() {
      if (syncing) return;
      syncing = true;
      if (!outbox && pending > 0) outbox = takeBatch();
      try {
        if (!tg.initData) throw new Error("нет initData (открыто не из Telegram?)");
        const result = await api("/api/sync", { v: CLIENT_V, ...(outbox || { clicks: 0 }) });
        outbox = null;
        applyState(result);
        if (!afkShown && !document.hidden) {
          afkShown = true;
          showAfkSummary(result.afk);
        }
        $("status").textContent = "";
      } catch (e) {
        if (e.status >= 400 && e.status < 500 && e.status !== 429) outbox = null;   // сервер отверг пачку: повторять нет смысла
        $("status").textContent = "❌ " + e.message;
      }
      syncing = false;
    }

    function showAfkSummary(afk) {
      const earned = afk.earned;
      $("afkEarned").textContent = (earned < 0 ? "−" : "+") +
        Math.abs(earned).toLocaleString("ru-RU", { maximumFractionDigits: 1 }) + " 🌱";
      const minutes = Math.floor(Math.min(afk.counted_seconds, 8 * 3600) / 60);
      const hours = Math.floor(minutes / 60);
      $("afkTime").textContent = hours + ":" + String(minutes % 60).padStart(2, "0") + "/8:00";
      $("afkFill").style.width = (minutes / (8 * 60) * 100) + "%";
      $("afkModal").hidden = false;
    }
    function animateAfkSpores() {
      const start = $("afkBar").getBoundingClientRect();
      const end = $("spores").getBoundingClientRect();
      const x = start.left + start.width / 2;
      const y = start.top + start.height / 2;
      const dx = end.left + end.width / 2 - x;
      const dy = end.top + end.height / 2 - y;
      for (let i = 0; i < 16; i++) {
        const offsetX = (Math.random() - .5) * start.width * .75;
        const offsetY = (Math.random() - .5) * start.height;
        const curve = (Math.random() - .5) * Math.min(100, Math.abs(dx) * .3);
        const turn = (Math.random() < .5 ? -1 : 1) * (540 + Math.random() * 540);
        const duration = 650 + Math.random() * 350;
        const particle = document.createElement("span");
        particle.className = "afk-particle";
        particle.textContent = "🌱";
        particle.style.left = (x + offsetX) + "px";
        particle.style.top = (y + offsetY) + "px";
        document.body.appendChild(particle);
        particle.animate([
          { transform: "translate(-50%, -50%) rotate(0deg) scale(.55)", opacity: 0, filter: "brightness(1.4)" },
          { transform: "translate(-50%, -50%) rotate(90deg) scale(1.15)", opacity: 1, offset: .16 },
          { transform: `translate(calc(-50% + ${dx * .52 + curve}px), calc(-50% + ${dy * .52 - 30}px)) rotate(${turn * .65}deg) scale(.9)`,
            opacity: 1, offset: .62 },
          { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(${turn}deg) scale(.25)`,
            opacity: 0, filter: "brightness(2)" },
        ], { duration, delay: i * 32, easing: "cubic-bezier(.22,.75,.25,1)", fill: "forwards" })
          .onfinish = () => particle.remove();
      }
    }
    $("afkClose").onclick = () => {
      animateAfkSpores();
      $("afkModal").hidden = true;
    };
    async function syncOnReturn() {
      while (syncing) await new Promise((r) => setTimeout(r, 50));
      afkShown = false;
      await sync();
    }
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) syncOnReturn();
    });

    // действие, которое меняет состояние (купить, поставить, продать…)
    async function act(path, body, okText) {
      if (busy) return false;
      busy = true;
      while (syncing) await new Promise((r) => setTimeout(r, 50));
      await sync();                                   // сначала отправляем накопленные клики
      let ok = false;
      try {
        const res = await api(path, body);
        applyState(res);
        if (res.shop) setShop(res.shop);               // покупка/обновление вернули свежий магазин
        closeCard();
        if (okText) toast(okText);
        try { tg.HapticFeedback.notificationOccurred("success"); } catch (_) {}
        ok = true;
      } catch (e) {
        alertMsg(e.message);
      }
      busy = false;
      return ok;
    }

    // ---------- отрисовка ----------
    function render() {
      setText($("spores"), "🌱 " + fmt(spores));
      setText($("dust"), "✨ " + fmt(dust));
      $("income").textContent = "+" + passive.toLocaleString("ru-RU", { maximumFractionDigits: 1 }) + " спор/сек" +
        (state && (state.click_mult > 1 || state.passive_mult > 1)
          ? " · 🔮 ×" + num(state.click_mult) + (state.passive_mult !== state.click_mult ? "/×" + num(state.passive_mult) : "") : "");
      if (!state) return;
      const lo = state.xp_floor, hi = state.xp_ceil;
      const frac = Math.min(1, Math.max(0, (xp - lo) / (hi - lo)));
      $("xpfill").style.width = (frac * 100) + "%";
      $("lvl").textContent = "Ур. " + state.level;
      $("xptext").textContent = fmt(Math.min(Math.max(xp - lo, 0), hi - lo)) + "/" + fmt(hi - lo);
      if (costEl && nextCost) costEl.classList.toggle("ok", spores >= nextCost.spores && dust >= nextCost.dust);
    }

    // подгоняем поляну под экран (пропорции 5:4) и размеры слотов
    function layout() {
      const w = Math.min(stage.clientWidth, stage.clientHeight * SCENE_RATIO);
      scene.style.width = w + "px";
      scene.style.height = (w / SCENE_RATIO) + "px";
      if (!state) return;
      state.slots.forEach((s, i) => {
        const size = w * 0.15 * s.scale;
        slotEls[i].style.width = slotEls[i].style.height = size + "px";
        slotEls[i].style.fontSize = size * 0.5 + "px";
      });
    }
    window.addEventListener("resize", layout);

    function costText(c) {
      return fmt(c.spores) + " 🌱" + (c.dust ? " + " + fmt(c.dust) + " ✨" : "");
    }

    function renderSlots() {
      scene.querySelectorAll(".slot").forEach((e) => e.remove());
      costEl = null; nextCost = null;
      const next = nextLocked();
      slotEls = state.slots.map((s, i) => {
        const el = document.createElement("div");
        el.className = "slot";
        el.style.left = s.x + "%";
        el.style.top = s.y + "%";
        el.style.zIndex = Math.round(s.y * 10);          // что ниже на экране, то поверх
        el.dataset.index = i;

        const mound = new Image();                       // кочка под грибом
        mound.className = "mound";
        mound.src = "assets/slot_empty.webp";
        mound.draggable = false;
        mound.onerror = () => mound.remove();
        el.appendChild(mound);

        if (!s.unlocked) {
          el.classList.add("locked");
          const lock = new Image();
          lock.className = "lock";
          lock.src = s.wild ? "assets/icon_lock_wild.webp" : "assets/icon_lock.webp";   // для диких можно нарисовать свой рыжий замок
          lock.draggable = false;
          if (s.wild) { el.classList.add("wild"); lock.onerror = () => { lock.onerror = null; lock.classList.add("tint"); lock.src = "assets/icon_lock.webp"; }; }
          else lock.onerror = () => { const t = document.createElement("div"); t.className = "lock"; t.textContent = "🔒"; lock.replaceWith(t); };
          el.appendChild(lock);
          if (i === next && s.cost) {
            el.classList.add("next");
            costEl = document.createElement("div");
            costEl.className = "cost";
            costEl.textContent = costText(s.cost);
            nextCost = s.cost;
            el.appendChild(costEl);
          }
        } else if (!s.mushroom) {
          el.classList.add("empty");
          if (s.wild) el.classList.add("wild");
          if (i === targetSlot) el.classList.add("target");
          const plus = document.createElement("div");
          plus.className = "plus";
          plus.textContent = "+";
          el.appendChild(plus);
        } else {
          el.classList.add("filled");
          if (s.wild) el.classList.add("wild");
          if (s.mushroom.kind === "boost") el.classList.add("boost");
          el.appendChild(icon(s.mushroom, true));
        }
        scene.appendChild(el);
        return el;
      });
      layout();
    }

    function renderInv() {
      const inv = state.inventory;
      if (curTab >= inv.tabs) curTab = 0;
      $("invCount").textContent = inv.items.length + "/" + inv.capacity;
      if (sellMode) renderSell();
      renderSort();
      $("sheetHint").textContent = targetSlot != null ? "Выбери гриб для слота №" + (targetSlot + 1) : "";

      const tabs = $("tabs");
      tabs.innerHTML = "";
      for (let t = 0; t < inv.tabs; t++) {
        const b = document.createElement("button");
        b.textContent = t + 1;
        if (t === curTab) b.className = "on";
        b.onclick = () => { curTab = t; renderInv(); };
        tabs.appendChild(b);
      }
      if (inv.next_tab_cost != null) {
        const b = document.createElement("button");
        b.className = "buy";
        b.textContent = "🔒 " + fmt(inv.next_tab_cost) + " ✨";
        b.onclick = openBuyTab;
        tabs.appendChild(b);
      }

      const grid = $("grid");
      grid.innerHTML = "";
      const byPos = new Map(inv.items.map((x) => [x.pos, x]));
      for (let i = 0; i < inv.per_tab; i++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.dataset.pos = curTab * inv.per_tab + i;
        const it = byPos.get(curTab * inv.per_tab + i);
        if (it) {
          cell.dataset.item = it.item;
          if (sellMode && sellPicks(it)) cell.classList.add("picked");
          if (pickedItem === it.item) cell.classList.add("sel");
          cell.style.borderColor = it.color;
          cell.appendChild(icon(it));
          if (it.level > state.level) {
            const lv = document.createElement("div");
            lv.className = "lv";
            lv.textContent = "ур." + it.level;
            cell.appendChild(lv);
          }
        }
        grid.appendChild(cell);
      }
    }

    let stateAt = Date.now();
    function applyState(s) {
      state = s;
      stateAt = Date.now();
      clickPower = s.click_power;
      passive = s.passive;
      dust = s.dust;
      spores = s.spores + unsent() * clickPower;       // + клики, сделанные пока шёл запрос
      xp = s.xp + unsent();
      const sig = JSON.stringify(s.slots) + targetSlot;
      if (sig !== slotSig) { slotSig = sig; renderSlots(); }
      const isig = JSON.stringify(s.inventory) + s.level;
      if (isig !== invSig) { invSig = isig; renderInv(); }
      $("shopDot").hidden = !s.offer.available;
      applyAnti(s.anti);
      render();
    }

    // ---------- шторка инвентаря ----------
    function openSheet() { renderInv(); $("sheet").classList.add("open"); }
    function refreshSlots() {                         // перерисовать слоты, не трогая счётчики
      slotSig = JSON.stringify(state.slots) + targetSlot;
      renderSlots();
    }
    function closeSheet() {
      pickedItem = null;
      if (sellMode) toggleSell(false);
      $("sheet").classList.remove("open");
      if (targetSlot != null) { targetSlot = null; if (state) refreshSlots(); }
    }
    $("btnInv").onclick = () => { if (state) openSheet(); };
    $("sheetClose").onclick = closeSheet;
    // Запасной способ без перетаскивания: тап по грибу выбирает его, тап по другой ячейке переносит (или меняет местами)
    let pickedItem = null;
    function tapCell(pos, item) {
      if (sellMode || !state) return;
      if (pickedItem === null) {
        if (item) { pickedItem = item.item; renderInv(); toast("Теперь тапни по ячейке, куда поставить"); }
        return;
      }
      const id = pickedItem;
      pickedItem = null;
      const cur = state.inventory.items.find((x) => x.item === id);
      if (cur && cur.pos !== pos) act("/api/inv_move", { item: id, to: pos }); else renderInv();
    }
    $("grid").addEventListener("click", (e) => {
      const cell = e.target.closest(".cell");
      if (cell && !cell.dataset.item) tapCell(Number(cell.dataset.pos), null);
    });
    document.addEventListener("touchmove", (e) => { if (inventoryGesture && inventoryGesture.dragging) e.preventDefault(); }, { passive: false });
    function cellAt(x, y) {
      for (const c of $("grid").children) {
        const r = c.getBoundingClientRect();
        if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return c;
      }
      return null;
    }
    $("grid").addEventListener("pointerdown", (e) => {
      const cell = e.target.closest(".cell[data-item]");
      if (!cell || !state || !e.isPrimary) return;
      const item = state.inventory.items.find((entry) => entry.item === Number(cell.dataset.item));
      if (!item) return;
      inventoryGesture = {
        item, pointerId: e.pointerId, x: e.clientX, y: e.clientY, dragging: false, holdTimer: null,
      };
      cell.setPointerCapture(e.pointerId);
      inventoryGesture.holdTimer = setTimeout(() => {
        if (inventoryGesture && !inventoryGesture.dragging) { inventoryGesture.held = true; pickedItem = null; showItem(item); }
      }, 600);
    });
    document.addEventListener("pointermove", (e) => {
      if (!inventoryGesture || inventoryGesture.pointerId !== e.pointerId) return;
      if (!inventoryGesture.dragging &&
          Math.hypot(e.clientX - inventoryGesture.x, e.clientY - inventoryGesture.y) >= 10) {
        clearTimeout(inventoryGesture.holdTimer);
        inventoryGesture.dragging = true;
        $("sheet").classList.add("dragging");
        dragGhost = icon(inventoryGesture.item);
        dragGhost.classList.add("drag-ghost");
        document.body.appendChild(dragGhost);
      }
      if (dragGhost) {
        dragGhost.style.left = e.clientX + "px";
        dragGhost.style.top = e.clientY + "px";
      }
      document.querySelectorAll(".slot.drop-target, .cell.drop-target").forEach((slot) => slot.classList.remove("drop-target"));
      if (inventoryGesture.dragging) {
        const target = document.elementFromPoint(e.clientX, e.clientY)?.closest(".slot.empty");
        if (target && target.classList.contains("empty")) target.classList.add("drop-target");
        const cell = cellAt(e.clientX, e.clientY);                  // шторка в этот момент прозрачна для касаний, ищем по рамкам
        if (cell) cell.classList.add("drop-target");
      }
    });
    document.addEventListener("pointerup", (e) => {
      if (!inventoryGesture || inventoryGesture.pointerId !== e.pointerId) return;
      const gesture = inventoryGesture;
      inventoryGesture = null;
      clearTimeout(gesture.holdTimer);
      if (!gesture.dragging) {
        if (!gesture.held && e.target.closest && e.target.closest("#grid")) tapCell(gesture.item.pos, gesture.item);
        return;
      }
      pickedItem = null;
      e.preventDefault();
      e.stopImmediatePropagation();
      const target = document.elementFromPoint(e.clientX, e.clientY)?.closest(".slot.empty");
      const cell = target ? null : cellAt(e.clientX, e.clientY);
      $("sheet").classList.remove("dragging");
      document.querySelectorAll(".slot.drop-target, .cell.drop-target").forEach((slot) => slot.classList.remove("drop-target"));
      if (dragGhost) { dragGhost.remove(); dragGhost = null; }
      if (cell) {
        const to = Number(cell.dataset.pos);
        if (to !== gesture.item.pos) act("/api/inv_move", { item: gesture.item.item, to });
        return;
      }
      if (!target) return;
      const slot = Number(target.dataset.index);
      if (state.slots[slot]?.unlocked) {
        act("/api/place", { item: gesture.item.item, slot }, "Гриб посажен 🌱").then((ok) => {
          if (ok) closeSheet();
        });
      }
    }, true);
    document.addEventListener("pointercancel", () => {
      if (inventoryGesture) clearTimeout(inventoryGesture.holdTimer);
      inventoryGesture = null;
      $("sheet").classList.remove("dragging");
      if (dragGhost) { dragGhost.remove(); dragGhost = null; }
      document.querySelectorAll(".slot.drop-target").forEach((slot) => slot.classList.remove("drop-target"));
    });

    // ---------- сортировка инвентаря ----------
    let sortBy = "rarity", sortDesc = true;
    function renderSort() {
      document.querySelectorAll("#sortRow button").forEach((b) => {
        const on = b.dataset.by === sortBy;
        b.className = on ? "on" : "";
        b.textContent = (b.dataset.by === "rarity" ? "Редкость" : "Цена") + (on ? (sortDesc ? " ↓" : " ↑") : "");
      });
    }
    $("sortRow").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-by]");
      if (!b) return;
      if (sortBy === b.dataset.by) sortDesc = !sortDesc; else { sortBy = b.dataset.by; sortDesc = true; }
      renderSort();
      act("/api/inv_sort", { by: sortBy, desc: sortDesc });
    });

    // ---------- «Продать все»: выбор редкостей ----------
    let sellMode = false, sellSel = new Set(), keepGlossy = true;
    const sellPicks = (it) => sellSel.has(it.rarity) && !(keepGlossy && it.glossy);
    function sellList() {                       // что сейчас будет продано
      const list = state.inventory.items.filter(sellPicks);
      if (list.length && list.length >= state.inventory.items.length + state.slots.filter((x) => x.mushroom).length) {
        list.sort((a, b) => (b.sale_spores + b.sale_dust * 100) - (a.sale_spores + a.sale_dust * 100)).shift();      // один гриб остаётся
      }
      return list;
    }
    const totalText = (list) => saleText(list.reduce((a, it) => a + it.sale_spores, 0), list.reduce((a, it) => a + it.sale_dust, 0));
    function renderSell() {
      $("sheet").classList.toggle("selling", sellMode);
      $("sellPanel").hidden = !sellMode;
      $("sellAll").classList.toggle("on", sellMode);
      $("sellAll").textContent = sellMode ? "✕ Отмена" : "💰 Продать все";
      if (!sellMode || !state) return;
      const items = state.inventory.items;
      const box = $("sellChips");
      box.innerHTML = "";
      const chip = (label, color, on, fn) => {
        const b = document.createElement("button");
        b.className = "chip" + (on ? " on" : "");
        if (color) b.style.setProperty("--c", color);
        b.innerHTML = label;
        b.onclick = fn;
        box.appendChild(b);
      };
      const seen = new Map();
      items.forEach((it) => {
        const r = seen.get(it.rarity) || { name: it.rarity_name, color: it.color, rank: it.rank, n: 0 };
        r.n++; seen.set(it.rarity, r);
      });
      [...seen.entries()].sort((a, b) => a[1].rank - b[1].rank).forEach(([key, r]) =>
        chip(r.name + "<i>" + r.n + "</i>", r.color, sellSel.has(key), () => {
          sellSel.has(key) ? sellSel.delete(key) : sellSel.add(key); renderSell(); renderInv();
        }));
      chip("💎 Глянцевые остаются", "#ffe27a", keepGlossy, () => { keepGlossy = !keepGlossy; renderSell(); renderInv(); });
      const list = sellList();
      $("sellGo").disabled = !list.length;
      $("sellGo").textContent = list.length ? "Продать " + list.length + " шт. за " + totalText(list)
                                            : (sellSel.size ? "Нечего продавать" : "Выбери редкости");
    }
    function toggleSell(on) {
      sellMode = on; sellSel = new Set();
      if (state) { renderSell(); renderInv(); }
    }
    $("sellAll").onclick = () => toggleSell(!sellMode);
    $("sellGo").onclick = () => {
      const list = sellList();
      if (!list.length) return;
      const risky = list.some((it) => it.rank >= 3);
      showCard(`<div class="big">Продать ${list.length} шт.?</div>
        <div style="margin-top:6px">Выручка: <b>${totalText(list)}</b></div>
        ${risky ? '<div class="bad" style="margin-top:6px">Среди них есть редкие и выше!</div>' : ""}
        <div class="btns"><button class="sell" data-act="sellbulk">Продать</button>
          <button class="ghost" data-act="close">Отмена</button></div>`);
    };

    // ---------- карточки ----------
    function showCard(html) {
      $("card").innerHTML = html;
      infoOpenedAt = Date.now();
      $("info").hidden = false;
    }
    function closeCard() { $("info").hidden = true; }

    $("info").addEventListener("click", (e) => {
      if (e.target === $("info") && Date.now() - infoOpenedAt > 300) closeCard();
    });
    $("card").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-act]");
      if (!b) return;
      const d = b.dataset;
      switch (d.act) {
        case "close": closeCard(); break;
        case "unlock": act("/api/unlock", { slot: Number(d.slot) }, "Слот открыт!"); break;
        case "buytab": act("/api/buy_tab", {}, "Новая вкладка!"); break;
        case "shopbuy": act("/api/shop/buy", {}, "Гриб в инвентаре 🎒"); break;
        case "lotbuy": { const l = shopData && shopData.lots.find((x) => x.id === d.id); if (l) buyLot(l); break; }
        case "refresh": act("/api/auction/refresh", {}, "Аукцион обновлён 🔄"); break;
        case "unplace": act("/api/unplace", { slot: Number(d.slot) }, "Гриб убран в инвентарь"); break;
        case "sellbulk": {
          const rarities = [...sellSel];
          act("/api/sell_bulk", { rarities, keep_glossy: keepGlossy }).then((ok) => {
            if (ok) { toggleSell(false); toast("Продано"); }
          });
          break;
        }
        case "sell": act("/api/sell", { item: Number(d.item) }, "Продано!"); break;
        case "place":
          act("/api/place", { item: Number(d.item), slot: Number(d.slot) }, "Гриб посажен 🌱").then((ok) => {
            if (ok && targetSlot != null) closeSheet();
          });
          break;
      }
    });

    function stats(m) {
      if (m.kind === "boost") {
        return `<div>🔮 Усилитель: сам не кликает, а множит остальных</div>` +
          (m.boost_click ? `<div>👆 ${pct(m.boost_click)} к силе клика</div>` : "") +
          (m.boost_passive ? `<div>⏳ ${pct(m.boost_passive)} к пассивному доходу</div>` : "");
      }
      return `<div>👆 ${fmt(m.click)} спор за клик</div>
              <div>⏳ ${num(m.passive)} спор/сек</div>`;
    }
    const shortStats = (m) => m.kind === "boost"
      ? "🔮 " + [m.boost_click ? "клик " + pct(m.boost_click) : "", m.boost_passive ? "доход " + pct(m.boost_passive) : ""].filter(Boolean).join(", ")
      : "👆 " + fmt(m.click) + " · ⏳ " + num(m.passive) + "/с";
    function mushHead(m) {
      return `<div class="head">${iconHtml(m)}<div>
                <div class="big">${m.name}${m.glossy ? " 💎" : ""}</div>
                <div style="color:${m.color}">${m.rarity_name}</div></div></div>
              <div class="muted" style="margin-bottom:8px">${m.desc}</div>`;
    }

    // гриб из инвентаря
    function pickSlot() {
      if (targetSlot != null && state.slots[targetSlot].unlocked && !state.slots[targetSlot].mushroom) return targetSlot;
      return state.slots.findIndex((s) => s.unlocked && !s.mushroom);
    }
    function showItem(it) {
      const free = pickSlot();
      let place;
      if (state.level < it.level) place = `<button class="dim" data-act="close">Нужен уровень ${it.level}</button>`;
      else if (free < 0) place = `<button class="dim" data-act="close">Нет свободных слотов</button>`;
      else place = `<button data-act="place" data-item="${it.item}" data-slot="${free}">Посадить в слот №${free + 1}</button>`;
      showCard(`${mushHead(it)}${stats(it)}
        <div class="${state.level < it.level ? "bad" : "muted"}">🎓 Нужен уровень: ${it.level}</div>
        <div class="btns">
          ${place}
          <button class="sell" data-act="sell" data-item="${it.item}">Продать за ${saleText(it.sale_spores, it.sale_dust)}</button>
          <button class="ghost" data-act="close">Закрыть</button>
        </div>`);
    }

    // гриб на поляне (удержание)
    function showPlaced(i) {
      const m = state.slots[i].mushroom;
      if (state.slots[i].wild) {
        const w = (state.wild || []).find((x) => x.slot === i);
        showCard(`${mushHead(m)}${stats(m)}
          <div class="muted">🌿 Дикий гриб: уйдёт сам${w ? " через " + fmtTime(Math.max(0, w.ends_in - (Date.now() - stateAt) / 1000)) : ""}</div>
          <div class="btns"><button class="ghost" data-act="close">Закрыть</button></div>`);
        return;
      }
      showCard(`${mushHead(m)}${stats(m)}
        <div class="muted">💰 Продажа: ${saleText(m.sale_spores, m.sale_dust)} (сначала убери в инвентарь)</div>
        <div class="btns">
          <button data-act="unplace" data-slot="${i}">Убрать в инвентарь</button>
          <button class="ghost" data-act="close">Закрыть</button>
        </div>`);
      try { tg.HapticFeedback.impactOccurred("medium"); } catch (_) {}
    }

    function openUnlock(i) {
      const c = state.slots[i].cost;
      const enough = spores >= c.spores && dust >= c.dust;
      showCard(`
        <div class="big">Новый слот</div>
        <div style="margin-top:6px">Открыть слот №${i + 1} за ${costText(c)}?</div>
        <div class="muted">У тебя: ${fmt(spores)} 🌱 и ${fmt(dust)} ✨</div>
        <div class="btns">
          <button ${enough ? "" : 'class="dim"'} data-act="${enough ? "unlock" : "close"}" data-slot="${i}">${enough ? "Открыть" : "Не хватает"}</button>
          <button class="ghost" data-act="close">Отмена</button>
        </div>`);
    }

    function openBuyTab() {
      const inv = state.inventory;
      const enough = dust >= inv.next_tab_cost;
      showCard(`
        <div class="big">Вкладка №${inv.tabs + 1}</div>
        <div style="margin-top:6px">+${inv.per_tab} ячеек за ${fmt(inv.next_tab_cost)} ✨</div>
        <div class="muted">У тебя: ${fmt(dust)} ✨</div>
        <div class="btns">
          <button ${enough ? "" : 'class="dim"'} data-act="${enough ? "buytab" : "close"}">${enough ? "Купить" : "Не хватает ✨"}</button>
          <button class="ghost" data-act="close">Отмена</button>
        </div>`);
    }

    // ---------- магазин: предложение дня + аукцион ----------
    let shopFilter = "all", reloading = false;
    const norm = (t) => t.toLowerCase().replace(/ё/g, "е").trim();
    const num = (n) => Number(n).toLocaleString("ru-RU", { maximumFractionDigits: 1 });
    const secLeft = (v) => Math.max(0, v - (Date.now() - shopAt) / 1000);

    function setShop(d) { shopData = d; shopAt = Date.now(); if (shopOpen) renderShop(); }
    async function reloadShop() {
      if (reloading) return;
      reloading = true;
      try { await sync(); setShop(await api("/api/shop")); }
      catch (e) { toast("❌ " + e.message); }
      reloading = false;
    }
    function openShop() {
      closeSheet();
      shopOpen = true;
      $("shop").classList.add("open");
      renderShop();                                  // сразу то, что уже знаем
      reloadShop();                                  // и подтягиваем свежее
    }
    function closeShop() { shopOpen = false; $("shop").classList.remove("open"); $("search").blur(); }
    $("shopClose").onclick = closeShop;
    $("btnShop").onclick = () => { if (state) openShop(); };

    // почему сейчас нельзя купить ("" = можно)
    function whyNot(price, needLevel) {
      if (state.level < needLevel) return "Нужен уровень " + needLevel;
      if (spores < price) return "Не хватает спор";
      return "";
    }

    function renderShop() {
      if (!shopData) { $("lots").innerHTML = '<div class="empty">Загрузка…</div>'; return; }
      renderDeal(); renderChips(); renderLots(); renderFoot();
      updateShopTimers();
    }

    function renderDeal() {
      const d = shopData.deal, m = d.mushroom;
      $("deal").innerHTML = `
        <div class="badge">−${d.discount}%</div>
        <div class="dtop"><span>🔥 Предложение дня</span><span>⏰ <span id="dealTimer"></span></span></div>
        <div class="dmain" data-open="deal">${iconHtml(m)}<div style="min-width:0">
          <div class="dname">${m.name}${m.glossy ? " 💎" : ""}</div>
          <div style="color:${m.color};font-size:13px">${m.rarity_name}</div>
          <div class="st">${shortStats(m)} · 🎓 ур. ${m.level}</div></div></div>
        <div class="dbuy"><div><s>${fmt(d.full_price)}</s><span class="newp">${fmt(d.price)} 🌱</span></div>
          <button class="buy" id="dealBtn"></button></div>`;
      refreshBuyStates();
    }

    function renderChips() {
      const box = $("chips");
      box.innerHTML = "";
      const add = (key, label, color, count) => {
        const b = document.createElement("button");
        b.className = "chip" + (shopFilter === key ? " on" : "") + (count === 0 ? " zero" : "");
        if (color) b.style.setProperty("--c", color);
        b.innerHTML = label + "<i>" + count + "</i>";
        b.onclick = () => { shopFilter = key; renderChips(); renderLots(); };
        box.appendChild(b);
      };
      add("all", "Все", "", shopData.lots.filter((l) => l.qty > 0).length);
      shopData.rarities.forEach((r) => add(r.key, r.name, r.color, r.count));
    }

    const group = (l) => (l.qty === 0 ? 2 : state.level < l.level ? 1 : 0);
    function renderLots() {
      const q = norm($("search").value);
      const list = shopData.lots
        .filter((l) => (shopFilter === "all" || l.rarity === shopFilter) && (!q || norm(l.name).includes(q)))
        .sort((a, b) => group(a) - group(b));          // сначала то, что можно купить; потом по уровню недоступное; раскупленное внизу
      const box = $("lots");
      if (!list.length) {
        let text = "Сейчас аукцион пуст. Загляни после обновления.";
        if (q) text = "Ничего не нашлось по запросу «" + $("search").value.trim() + "»";
        else if (shopFilter !== "all") {
          const r = shopData.rarities.find((x) => x.key === shopFilter);
          text = "Сейчас на аукционе нет грибов редкости «" + (r ? r.name : "") + "». Они могут появиться после обновления.";
        }
        box.innerHTML = "";
        const e = document.createElement("div");
        e.className = "empty";
        e.textContent = text;
        box.appendChild(e);
        return;
      }
      box.innerHTML = list.map((l) => `
        <div class="lot${l.qty === 0 ? " sold" : ""}" data-id="${l.id}" style="--c:${l.color}">
          ${iconHtml(l)}
          <div class="info">
            <div class="nm">${l.name}</div>
            <div class="rr"><span style="color:${l.color}">${l.rarity_name}</span> · в наличии: ${l.qty}</div>
            <div class="st">${shortStats(l)}</div>
          </div>
          <button class="buy"></button>
        </div>`).join("");
      refreshBuyStates();
    }

    function renderFoot() {
      const r = shopData.refresh, b = $("btnRefresh");
      b.disabled = r.cost == null;
      b.textContent = r.cost == null ? "Лимит обновлений на сегодня" : "🔄 Обновить лоты · 🌱 " + fmt(r.cost);
      $("refreshNote").innerHTML = "Обновлений за сутки: " + r.used + "/" + r.max +
        (r.used > 0 ? ' · сброс через <b id="resetTimer"></b>' : "");
      refreshBuyStates();
    }

    // кнопки «купить»: цвет и подпись зависят от уровня и денег (вызывается каждую секунду)
    function setBtn(b, cls, text) {
      const c = "buy" + (cls ? " " + cls : "");
      if (b.className !== c) b.className = c;
      if (b.textContent !== text) b.textContent = text;
    }
    function refreshBuyStates() {
      if (!shopData || !state) return;
      document.querySelectorAll("#lots .lot").forEach((el) => {
        const l = shopData.lots.find((x) => x.id === el.dataset.id);
        if (!l) return;
        const b = el.querySelector(".buy");
        if (l.qty === 0) setBtn(b, "sold", "Раскуплено");
        else if (state.level < l.level) setBtn(b, "lock", "🔒 ур. " + l.level);
        else setBtn(b, spores < l.price ? "poor" : "", "🌱 " + fmt(l.price));
      });
      const db = $("dealBtn");
      if (db) {
        const d = shopData.deal;
        if (d.bought) setBtn(db, "sold", "Куплено ✅");
        else if (state.level < d.mushroom.level) setBtn(db, "lock", "🔒 ур. " + d.mushroom.level);
        else setBtn(db, spores < d.price ? "poor" : "", "Купить");
      }
      const rb = $("btnRefresh");
      if (rb && shopData.refresh.cost != null) rb.classList.toggle("poor", spores < shopData.refresh.cost);
    }

    function updateShopTimers() {
      const d = shopData;
      const set = (id, v) => { const e = $(id); if (e) e.textContent = fmtTime(v); };
      set("dealTimer", secLeft(d.deal.expires_in));
      set("lotsTimer", secLeft(d.lots_expire_in));
      set("resetTimer", secLeft(d.refresh.resets_in));
      const over = secLeft(d.deal.expires_in) <= 0 || secLeft(d.lots_expire_in) <= 0 ||
                   (d.refresh.used > 0 && secLeft(d.refresh.resets_in) <= 0);
      if (over) reloadShop();
    }
    function shopTick() { updateShopTimers(); refreshBuyStates(); }

    function buyLot(l) {
      if (l.qty === 0) return;
      const why = whyNot(l.price, l.level);
      if (why) { closeCard(); return toast(why); }
      act("/api/auction/buy", { mushroom: l.id, price: l.price }, "Куплено: " + l.name + " 🎒")
        .then((ok) => { if (!ok) reloadShop(); });                   // вдруг аукцион уже обновился
    }
    function buyDeal() {
      const d = shopData.deal;
      if (d.bought) return;
      const why = whyNot(d.price, d.mushroom.level);
      if (why) { closeCard(); return toast(why); }
      act("/api/shop/buy", {}, "Гриб в инвентаре 🎒").then((ok) => { if (!ok) reloadShop(); });
    }

    function lotCard(m, price, buyAttrs, extra, blocked) {
      const why = blocked || whyNot(price, m.level);
      const buy = why ? `<button class="dim" data-act="close">${why}</button>`
                      : `<button ${buyAttrs}>Купить за ${fmt(price)} 🌱</button>`;
      showCard(`${mushHead(m)}${stats(m)}
        <div class="${state.level < m.level ? "bad" : "muted"}">🎓 Нужен уровень: ${m.level}</div>
        ${extra || ""}
        <div class="btns">${buy}<button class="ghost" data-act="close">Закрыть</button></div>`);
    }

    $("lots").addEventListener("click", (e) => {
      const el = e.target.closest(".lot");
      const l = el && shopData.lots.find((x) => x.id === el.dataset.id);
      if (!l) return;
      if (e.target.closest(".buy")) buyLot(l);
      else lotCard(l, l.price, `data-act="lotbuy" data-id="${l.id}"`, "", l.qty === 0 ? "Раскуплено" : "");
    });
    $("deal").addEventListener("click", (e) => {
      if (!shopData) return;
      const d = shopData.deal;
      if (e.target.closest(".buy")) return buyDeal();
      if (d.bought) return;
      lotCard(d.mushroom, d.price, 'data-act="shopbuy"',
        `<div style="margin-top:6px">🔥 Скидка −${d.discount}%: <s>${fmt(d.full_price)}</s> → <b>${fmt(d.price)} 🌱</b></div>`);
    });
    $("search").addEventListener("input", () => { if (shopData) renderLots(); });

    $("btnRefresh").onclick = () => {
      if (!shopData || shopData.refresh.cost == null) return;
      const r = shopData.refresh, enough = spores >= r.cost;
      showCard(`
        <div class="big">Обновить аукцион?</div>
        <div style="margin-top:6px">Текущие лоты исчезнут, появятся новые. Цена: <b>${fmt(r.cost)} 🌱</b></div>
        <div class="muted">Обновление ${r.used + 1} из ${r.max} за сутки, каждое следующее дороже.</div>
        <div class="muted">У тебя: ${fmt(spores)} 🌱</div>
        <div class="btns">
          <button ${enough ? "" : 'class="dim"'} data-act="${enough ? "refresh" : "close"}">${enough ? "Обновить" : "Не хватает спор"}</button>
          <button class="ghost" data-act="close">Отмена</button>
        </div>`);
    };
    $("btnMut").onclick = () => alertMsg("Мутации скоро!");
    $("btnPack").onclick = () => alertMsg("Паки скоро!");
    $("btnUpgrades").onclick = () => showCard(`
      <div class="big">⬆️ Улучшения</div>
      <div class="muted" style="margin-top:8px">Ветка улучшений скоро появится. Здесь будут улучшения параметров игры.</div>
      <div class="btns"><button class="ghost" data-act="close">Закрыть</button></div>`);

    // ---------- проверка «ты не робот?» ----------
    let anti = { state: "ok" }, antiAt = 0;
    function applyAnti(a) {
      if (!a) return;
      anti = a; antiAt = Date.now();
      $("antiModal").hidden = a.state !== "challenge";
      if (a.state === "challenge") {
        $("antiAsk").textContent = "Нажми на " + a.ask;
        $("antiOpts").innerHTML = "";
        a.options.forEach((o) => {
          const b = document.createElement("button");
          b.textContent = o;
          b.onclick = () => answerAnti(o);
          $("antiOpts").appendChild(b);
        });
      }
      tickAnti();
    }
    function tickAnti() {
      const left = anti.state === "blocked" ? Math.max(0, anti.until - (Date.now() - antiAt) / 1000) : 0;
      $("antiBar").textContent = left > 0 ? "⏸ Клики на паузе: " + fmtTime(left) : "";
    }
    setInterval(tickAnti, 500);
    async function answerAnti(choice) {
      try {
        const res = await api("/api/anti/answer", { choice });
        applyState(res);
        if (res.answer === "wrong") toast("Не тот значок, попробуй ещё");
        else if (res.answer === "ok") toast("Спасибо! Можно кликать");
      } catch (e) { toast("❌ " + e.message); }
    }
    const clicksPaused = () => anti.state !== "ok" && (anti.state !== "blocked" || Date.now() - antiAt < anti.until * 1000);

    // ---------- клики по поляне ----------
    const downAt = new Map();                          // когда палец/кнопка опустились (для длительности нажатия)
    function doClick(e) {                             // клик по поляне = клик сразу по всем грибам
      if (!e.isTrusted || !state || clickPower === 0) return;   // событие, сделанное скриптом, не считаем
      if (clicksPaused()) { if (anti.state === "blocked") toast("Клики на паузе"); return; }
      if (tapLog.length < MAX_TAP_LOG) {
        if (tapBase === null) tapBase = e.timeStamp;
        const t0 = downAt.get(e.pointerId);
        tapLog.push([Math.round(e.timeStamp - tapBase), Math.round(e.clientX), Math.round(e.clientY),
                     Math.round(t0 === undefined ? 0 : e.timeStamp - t0),
                     e.pointerType === "touch" ? 1 : e.pointerType === "pen" ? 2 : 0]);
      }
      spores += clickPower;
      xp += 1;
      pending++;
      render();

      slotEls.forEach((el) => {
        if (el.classList.contains("filled") && !el.classList.contains("boost")) {   // усилители просто стоят
          el.classList.remove("bump");
          void el.offsetWidth;
          el.classList.add("bump");
          const live = el.querySelector(".ico.anim");
          if (live && live.dataset.cur !== "click") playAnim(live, "click");
        }
      });

      const rect = scene.getBoundingClientRect();
      const pop = document.createElement("div");
      pop.className = "pop";
      pop.textContent = "+" + fmt(clickPower);
      pop.style.left = (e.clientX - rect.left - 10) + "px";
      pop.style.top = (e.clientY - rect.top - 20) + "px";
      pop.addEventListener("animationend", () => pop.remove());
      scene.appendChild(pop);

      try { tg.HapticFeedback.impactOccurred("light"); } catch (_) {}
    }

    scene.addEventListener("pointerdown", (e) => {
      downAt.set(e.pointerId, e.timeStamp);
      if (!e.isPrimary) return;
      held = false;
      clearTimeout(holdTimer);
      const slotEl = e.target.closest(".slot");
      scenePointer = { id: e.pointerId, x: e.clientX, y: e.clientY, moved: false };
      if (slotEl && (slotEl.classList.contains("filled") || slotEl.classList.contains("empty") ||
          (slotEl.classList.contains("locked") && (slotEl.dataset.index == nextLocked() || slotEl.classList.contains("wild"))))) {
        slotEl.setPointerCapture(e.pointerId);
        holdTimer = setTimeout(() => {
          held = true;
          const i = Number(slotEl.dataset.index);
          if (slotEl.classList.contains("filled")) showPlaced(i);
          else if (slotEl.classList.contains("empty")) {
            targetSlot = i;
            refreshSlots();
            openSheet();
          } else if (state.slots[i].wild) {
            toast("🔒 Дикая ячейка откроется в улучшениях");
          } else if (i === nextLocked() && state.slots[i].cost) {
            openUnlock(i);
          }
        }, 650);
      }
    });
    document.addEventListener("pointermove", (e) => {
      if (!scenePointer || scenePointer.id !== e.pointerId) return;
      if (Math.hypot(e.clientX - scenePointer.x, e.clientY - scenePointer.y) >= 12) {
        scenePointer.moved = true;
        clearTimeout(holdTimer);
      }
    });
    scene.addEventListener("pointerup", (e) => {
      setTimeout(() => downAt.delete(e.pointerId), 0);
      clearTimeout(holdTimer);
      const moved = scenePointer && scenePointer.id === e.pointerId && scenePointer.moved;
      scenePointer = null;
      if (!held && !moved && state) {
        const slotEl = e.target.closest(".slot");
        const i = slotEl ? Number(slotEl.dataset.index) : -1;
        if (!slotEl || !slotEl.classList.contains("locked")) {
          doClick(e);
        }
      }
      held = false;
    });
    scene.addEventListener("pointercancel", () => {
      clearTimeout(holdTimer);
      scenePointer = null;
      held = false;
    });
    document.addEventListener("contextmenu", (e) => e.preventDefault());

    // ---------- таймеры ----------
    setInterval(() => { spores += passive / 10; render(); }, 100);        // пассивный доход на экране
    setInterval(() => {                                                    // время сеанса
      const s = Math.floor((Date.now() - sessionStart) / 1000);
      $("time").textContent = "⏱ " + String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
      if (shopOpen && shopData) shopTick();                                // таймеры и кнопки магазина
    }, 1000);

    // пассивный доход: раз в секунду грибы чуть вздрагивают, над ними бледное "+N" (почти незаметно)
    const calm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    function passiveTick() {
      if (!state || document.hidden || calm || shopOpen) return;
      slotEls.forEach((el, i) => {
        const m = state.slots[i].mushroom;
        if (!m || !m.passive || !el.animate) return;
        const delay = Math.random() * 400;                                 // чтобы все не дёргались хором
        const ico = el.querySelector(".ico");
        if (ico) ico.animate([
          { transform: "translateY(0) rotate(0deg)" },
          { transform: "translateY(-1.5%) rotate(-1.2deg)", offset: 0.35 },
          { transform: "translateY(0) rotate(0.8deg)", offset: 0.7 },
          { transform: "translateY(0) rotate(0deg)" }], { duration: 550, delay, easing: "ease-in-out" });
        const t = document.createElement("div");
        t.className = "ptick";
        t.textContent = "+" + num(m.passive);
        t.style.fontSize = Math.max(10, el.offsetWidth * 0.2) + "px";
        el.appendChild(t);
        t.animate([
          { opacity: 0, transform: "translate(-50%, 0)" },
          { opacity: 0.4, transform: "translate(-50%, -6px)", offset: 0.25 },
          { opacity: 0, transform: "translate(-50%, -20px)" }], { duration: 1300, delay, easing: "ease-out", fill: "both" })
          .onfinish = () => t.remove();
      });
    }
    setInterval(passiveTick, 1000);
    let idleTicks = 0;
    setInterval(() => {                                                    // связь с сервером
      idleTicks++;
      const wildDue = state && (state.wild || []).some((w) => w.ends_in - (Date.now() - stateAt) / 1000 <= 0);
      const wildWait = state && state.slots.some((x) => x.wild && x.unlocked && !x.mushroom) && idleTicks >= 4;
      if (!document.hidden && !busy && (pending > 0 || idleTicks >= 10 || wildDue || wildWait)) { idleTicks = 0; sync(); }
    }, 1000);

    curify(document.body);
    layout();
    sync();
  </script>
</body>
</html>
