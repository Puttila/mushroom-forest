<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Грибной лес</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { margin: 0; background: #1b2a1f; color: #e8f5e0;
           font-family: sans-serif; text-align: center; user-select: none; }
    #spores { font-size: 32px; margin-top: 40px; }
    #mushroom { font-size: 140px; margin-top: 40px; display: inline-block;
                cursor: pointer; transition: transform 0.08s; }
    #mushroom:active { transform: scale(0.88); }
  </style>
</head>
<body>
  <div id="spores"></div>
  <div id="mushroom">🍄</div>

  <script>
    const API = " https://middle-roommate-powers-wholesale.trycloudflare.com ";  

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const counter = document.getElementById("spores");
    const mushroom = document.getElementById("mushroom");

    let spores = 0;      // очки, которые видит игрок
    let pending = 0;     // клики, ещё не отправленные на сервер

    function render() {
      counter.textContent = "🌱 " + spores;
    }

    async function sync() {
      const clicks = pending;
      pending = 0;
      try {
        const r = await fetch(API + "/api/sync", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Init-Data": tg.initData },
          body: JSON.stringify({ clicks })
        });
        if (!r.ok) throw new Error("server error");
        const data = await r.json();
        spores = data.spores + pending;   // + клики, сделанные пока шёл запрос
        render();
      } catch (e) {
        pending += clicks;                // не получилось: отправим в следующий раз
      }
    }

    mushroom.addEventListener("pointerdown", () => {
      spores++;
      pending++;
      render();
      tg.HapticFeedback.impactOccurred("light");
    });

    setInterval(() => { if (pending > 0) sync(); }, 1000);
    sync();      // при запуске загружаем сохранённые очки
    render();
  </script>
</body>
</html>
